name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        # TODO: replace with your project's tests, for example `npm ci && npm test`.
        run: |
          if [ -f scripts/test-setup.sh ]; then bash scripts/test-setup.sh; else echo "No tests yet. Add yours in .github/workflows/ci.yml."; fi

  scbee:
    # Scores this pull request's own files for launch readiness and agent-readiness, compares them with the base branch,
    # and keeps one comment on the pull request up to date with the top fixes. On pushes the scores go to the job summary.
    # It runs here, in your workflow, and sends nothing to ScBee, so private repositories work too.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # only for that one comment; remove this line to keep the scores in the job summary
    steps:
      - uses: actions/checkout@v4
      - uses: HMAKT99/scbee-action@v1
        with:
          fail-under: ""       # optional: fail the check below this launch readiness score, e.g. 60
