name: Set up

# Runs in a repository made from the agent-ready starter: on the first push it swaps in the starter files and writes
# this repository's name into them, in one commit. After that there is nothing left to do and it exits at once.
# It cannot change files in .github/workflows (the workflow token is not allowed to), so delete this file when you like.
on:
  push:

permissions:
  contents: write

jobs:
  setup:
    if: github.repository != 'HMAKT99/agent-ready-starter' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use this repository's name in the starter files
        run: |
          if [ ! -d template ]; then echo "Already set up."; exit 0; fi
          bash scripts/setup.sh "$GITHUB_REPOSITORY"
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Set up from the agent-ready starter"
          git push
